<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { showNotification } from './notification.js';  // On va créer un fichier pour les notifications

        const firebaseConfig = {
            apiKey: "AIzaSyDKJpdfbZ5-Me5rJ8mNrZ4dToBvt59H6Uk",
            authDomain: "flowup-ed44b.firebaseapp.com",
            projectId: "flowup-ed44b",
            storageBucket: "flowup-ed44b.firebasestorage.app",
            messagingSenderId: "43844276882",
            appId: "1:43844276882:web:90a6486fbf6ffde16e0c4b",
            measurementId: "G-EM9VBZH9S7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Fonction de login
        function loginUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log("Tentative de connexion avec l'email :", email);

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    console.log("Connexion réussie : ", userCredential.user);
                    showNotification("Connexion réussie !", "success");
                    // Redirection vers la page principale après la connexion réussie
                    window.location.href = 'main.html';
                })
                .catch((error) => {
                    console.error("Erreur de connexion : ", error.message);
                    showNotification("Échec de la connexion ! Veuillez vérifier vos identifiants.", "error");
                });
        }
    </script>
</head>
<body>
    <div class="container">
        <h2 class="my-5 text-center">Se connecter</h2>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Entrez votre email">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" id="password" class="form-control" placeholder="Entrez votre mot de passe">
        </div>

        <button class="btn btn-primary w-100" onclick="loginUser()">Se connecter</button>

        <p class="mt-3 text-center">Pas de compte ? <a href="register.html">Créer un compte</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
