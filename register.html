<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKJpdfbZ5-Me5rJ8mNrZ4dToBvt59H6Uk",
            authDomain: "flowup-ed44b.firebaseapp.com",
            projectId: "flowup-ed44b",
            storageBucket: "flowup-ed44b.firebasestorage.app",
            messagingSenderId: "43844276882",
            appId: "1:43844276882:web:90a6486fbf6ffde16e0c4b",
            measurementId: "G-EM9VBZH9S7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Fonction d'inscription
        function registerUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Rediriger vers la page de connexion après une inscription réussie
                    alert("Inscription réussie !");
                    window.location.href = 'login.html';
                })
                .catch((error) => {
                    console.error("Erreur d'inscription : ", error.message);
                    alert("Échec de l'inscription !");
                });
        }
    </script>
</head>
<body>
    <div class="container">
        <h2 class="my-5 text-center">Créer un compte</h2>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Entrez votre email">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" id="password" class="form-control" placeholder="Entrez votre mot de passe">
        </div>

        <button class="btn btn-primary w-100" onclick="registerUser()">Créer un compte</button>

        <p class="mt-3 text-center">Déjà un compte ? <a href="login.html">Se connecter</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
